services:
  grm-secured-local:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: grm-service-runtime
    image: grm-rs-service:secured-local
    environment:
      GRM_SERVICE_SECURITY_PROFILE: secured
      GRM_SERVICE_SECURITY_CONFIG: /secured-local/security.json
      GRM_SERVICE_TLS_SERVER_CERT: /secured-local/server.crt
      GRM_SERVICE_TLS_SERVER_KEY: /secured-local/server.key
      GRM_SERVICE_TLS_CLIENT_CA_CERT: /secured-local/ca.crt
    ports:
      - "127.0.0.1:50051:50051"
    volumes:
      - ../../.grm/secured-local:/secured-local:ro
      - ../../.grm/secured-local/workspaces:/workspaces
    command: ["grm-local-workspace-server", "0.0.0.0:50051", "/workspaces"]
