[package]
name = "grm-flight-deck-gateway"
version = "0.1.0"
edition = "2024"
description = "Read-only local HTTP adapter for the GRM flight-deck browser UI."
license = "Apache-2.0"
publish = false

[dependencies]
axum = "0.7"
grm-rs = { path = ".." }
grm-service-api = { path = "../grm-service-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.5", features = ["cors"] }
